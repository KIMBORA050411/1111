function choose(i,zoom=true){selected=i;let x=D[i];$('profile').innerHTML=`<span class="badge">${esc(x.region)} · ${i+1} / ${D.length}</span><div class="name">${esc(x.name)}</div>`+[['거주 지역',esc(x.address)],['취미',esc(x.hobby)],['가장 아끼는 것',esc(x.favorite)],['성별 (원본 응답)',esc(x.gender||'미입력')],['인스타그램',link(x.insta,ig(x.insta))],['GitHub',link(x.github,url(x.github))],['제출 페이지',link(x.page,url(x.page))]].map(([k,v])=>`<div class="field"><span>${k}</span>${v}</div>`).join('');markers();names();if(zoom&&map)map.flyTo(x.coord,11,{duration:.6})}function names(){let q=$('search').value.toLowerCase();$('names').innerHTML=D.map((x,i)=>({x,i})).filter(({x})=>[x.name,x.address,x.hobby].join(' ').toLowerCase().includes(q)).map(({x,i})=>`<button class="${i===selected?'active':''}" onclick="choose(${i})">${esc(x.name)}</button>`).join('')}function bars(o){return Object.entries(o).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="bar"><span>${esc(k)}</span><div class="track"><div class="fill" style="width:${v/D.length*100}%"></div></div><b>${v}명</b></div>`).join('')}const hobbyRules=[['음악·악기',/음악|노래|기타|우쿨렐레|콘서트|연주/],['게임',/게임|피파/],['영상·애니',/영화|애니|공포/],['운동',/운동/],['창작·수집',/그림|뜨개질|인형/],['독서',/독서/],['기타',/자기|위시/]];function render(){ $('tabs').innerHTML=tabs.map((t,i)=>`<button class="${i===mode?'active':''}" onclick="mode=${i};render()">0${i+1} ${t}</button>`).join('');$('maptitle').textContent=tabs[mode]+' 지도';let c=$('chart');if(mode===0||mode===1)c.innerHTML='<h2>지역별 분포</h2>'+bars(count(D.map(x=>x.region)));else if(mode===2)c.innerHTML='<h2>취미 분포 (복수 분류)</h2>'+bars(Object.fromEntries(hobbyRules.map(([k,r])=>[k,D.filter(x=>r.test(x.hobby)).length])))+'<small class="muted">원문 키워드 기반 분류이며 한 사람이 여러 분류에 포함될 수 있습니다.</small>';else if(mode===3)c.innerHTML='<h2>가장 아끼는 것 · 원본 응답</h2><div class="words">'+D.map((x,i)=>`<button class="word" onclick="choose(${i})">${esc(x.favorite)}</button>`).join('')+'</div>';else if(mode===4)c.innerHTML='<h2>성별 응답 분포</h2>'+bars(count(D.map(x=>x.gender||'미입력')))+'<small>비표준 응답도 원본 그대로 표시합니다.</small>';else c.innerHTML='<h2>개인 링크</h2><div class="words">'+D.map(x=>`<span class="word">${esc(x.name)} · ${mode===5?link(x.insta,ig(x.insta)):link('GitHub',url(x.github))+' / '+link(x.page?'제출':'미제출',url(x.page))}</span>`).join('')+'</div>';markers()}$('search').oninput=names;$('metro').onclick=()=>map&&map.setView([37.65,127.15],9);$('all').onclick=()=>{center=project([36.25,127.8]);span=440;drawView()};render();choose(0,false);
